<!DOCTYPE html>
<html>

<head>

    <title>SecureVault</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="login-card">

    <h1>SecureVault</h1>

    <p>Secure Employee Database</p>

    <form action="/login" method="post">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            name="capability_code"
            placeholder="Capability Code"
            required
        >

        <button>

            Login

        </button>

    </form>

</div>

</body>

</html>
